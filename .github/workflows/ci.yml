name: CI

on:
  push:
  pull_request:

jobs:
  laravel-12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer require --dev --no-update "laravel/framework:^12.0" "orchestra/testbench:^10.0"
      - run: composer update --prefer-dist --no-interaction --no-progress -W
      - run: composer lint
      - run: composer test

  laravel-13:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer require --dev --no-update "laravel/framework:^13.0" "orchestra/testbench:^11.0"
      - run: composer update --prefer-dist --no-interaction --no-progress -W
      - run: composer lint
      - run: composer test
